<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News App - Scorecard</title>
<style>
  :root{
    --bg:#f1eafc; --card:#ffffff; --ink:#1a1b31; --muted:#5c5d72; --line:#e6e0f2;
    --brand-green:#13ed70; --brand-lilac:#f1eafc; --brand-purple:#1a1b31;
    --green:#1a7f4b; --green-bg:#e3f4ea;
    --amber:#f59e0b; --amber-bg:#fff1d6; --amber-ink:#9a5800;
    --red:#c0392b;  --red-bg:#fbe5e2;
    --accent:#13ed70;
    --circle:270px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);line-height:1.4;min-height:100vh;
    background:radial-gradient(ellipse 70% 70% at 22% 62%, #13ed70 0%, rgba(19,237,112,.85) 30%, rgba(19,237,112,.35) 55%, rgba(241,234,252,0) 80%) no-repeat, var(--brand-lilac);}
  header{max-width:1120px;margin:0 auto;padding:28px 20px 8px;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:28px;letter-spacing:-.01em}
  .meta{color:var(--ink);opacity:.75;font-size:14px}
  .legend{display:flex;gap:14px;font-size:13px;color:var(--ink);flex-wrap:wrap;background:rgba(255,255,255,.75);padding:8px 14px;border-radius:999px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}

  main{max-width:1120px;margin:0 auto;padding:12px 20px 40px}
  .board{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:20px}
  .quad{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;min-height:340px;box-shadow:0 8px 28px rgba(26,27,49,.08);display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--rag,#ccc)}
  /* keep content clear of the centre circle */
  .tl{padding-right:calc(var(--circle)/2 + 8px);padding-bottom:calc(var(--circle)/2 - 30px)}
  .tr{padding-left:calc(var(--circle)/2 + 8px);padding-bottom:calc(var(--circle)/2 - 30px)}
  .bl{padding-right:calc(var(--circle)/2 + 8px);padding-top:calc(var(--circle)/2 - 30px)}
  .br{padding-left:calc(var(--circle)/2 + 8px);padding-top:calc(var(--circle)/2 - 30px)}
  .quad h2{margin:0;font-size:19px}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;color:var(--rag-ink);background:var(--rag-bg);white-space:nowrap}
  .label{font-size:13px;color:var(--muted)}
  .big{font-size:40px;font-weight:750;letter-spacing:-.02em;line-height:1.05}
  .big small{font-size:16px;font-weight:600;color:var(--muted);margin-left:4px}
  .bar{position:relative;height:10px;background:#eceef2;border-radius:999px;overflow:visible}
  .bar>i{display:block;height:100%;border-radius:999px;background:var(--rag)}
  .bar>b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);right:0}
  .barlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .delta{font-size:13px;color:var(--muted)}
  .delta strong.up{color:var(--green)} .delta strong.down{color:var(--red)}
  .minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mini{background:#f7f8fa;border-radius:10px;padding:8px 10px}
  .mini .v{font-weight:700;font-size:16px}
  .mini .l{font-size:11px;color:var(--muted)}
  .cta{margin-top:auto;align-self:flex-start;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .cta:hover,.cta:focus-visible{background:var(--accent);color:var(--ink);outline:none}

  .centre{position:absolute;left:50%;top:50%;width:var(--circle);height:var(--circle);transform:translate(-50%,-50%);border-radius:50%;background:var(--card);border:10px solid rgba(255,255,255,.55);background-clip:padding-box;box-shadow:0 8px 28px rgba(26,27,49,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
  .ring{position:absolute;inset:6px}
  .centre .inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 30px}
  .centre h2{margin:0;font-size:17px}
  .centre .big{font-size:34px}
  .centre .label{font-size:12px}

  dialog{border:0;border-radius:18px;padding:0;max-width:640px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(20,25,35,.45)}
  .dhead{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
  .dhead h3{margin:0;font-size:18px}
  .close{background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
  .dbody{padding:18px 22px 22px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:#f7f8fa;border-radius:12px}
  .row .n{font-size:14px}
  .row .s{font-size:12px;color:var(--muted)}
  .row .v{font-weight:750;font-size:20px;white-space:nowrap;text-align:right}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:600}
  .note{font-size:12px;color:var(--muted)}
  .owner{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:6px;white-space:nowrap;background:var(--o-bg);color:var(--o-ink)}
  .owner::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--o-ink)}
  .o-product{--o-bg:#1a1b31;--o-ink:#13ed70}
  .o-product{color:#fff}
  .o-marketing{--o-bg:#e7dcfd;--o-ink:#5a2fc2}
  .o-adops{--o-bg:#dcecfb;--o-ink:#0d5a8f}
  .eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:-4px}
  .mini .owner{margin-top:6px}
  .eyebrow .owner{text-transform:none;letter-spacing:.02em}
  .owners{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;background:rgba(255,255,255,.75);padding:8px 14px;border-radius:999px}
  .keys{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  th .owner{margin-top:4px}
  /* Level 2 alert on the button */
  .cta-wrap{margin-top:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .cta-wrap .cta{margin-top:0}
  .alert-note{font-size:12px;font-weight:700;color:var(--a-ink)}
  .row.flag{border-left:5px solid var(--a);background:var(--a-bg)}
  .row.flag .s strong{color:var(--a-ink)}

  @media (max-width:820px){
    .board{grid-template-columns:1fr}
    .quad{padding:22px!important;min-height:0}
    .centre{position:relative;left:auto;top:auto;transform:none;margin:0 auto 4px;order:-1}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>News App - Scorecard</h1>
    <div class="meta" id="asOf"></div>
  </div>
  <div class="legend" aria-label="Status key">
    <span><i class="dot" style="background:var(--green)"></i>On track (≥80% of target)</span>
    <span><i class="dot" style="background:var(--amber)"></i>At risk (60–79%)</span>
    <span><i class="dot" style="background:var(--red)"></i>Off track (≤59%)</span>
  </div>
</header>

<main>
  <div class="board" id="board"></div>
</main>

<dialog id="drill" aria-labelledby="dTitle">
  <div class="dhead"><h3 id="dTitle"></h3><button class="close" aria-label="Close" onclick="drill.close()">×</button></div>
  <div class="dbody" id="dBody"></div>
</dialog>

<script>
/* ============ DATA — update these values each week ============ */
const DATA = {
  asOf: "Week ending 16 Nov 2026",
  lagging: {
    months: ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct"],
    subscribers: [122000,120000,120005,119990,119890,119790,119680,119890,119875,119800],
    downloads:   [8000,6031,7000,5600,5500,4992,4204,8000,7047,6200],
    subRevenue:  [610000,600000,600025,599950,599450,598950,598400,599450,599375,599000],
    adRevenue:   [31000,30000,28400,27900,28100,26900,24400,25400,23400,27900]
  },
  timeSpent: { value:1677000, target:2500000, prior:1824001 },
  frequency: {
    pct3Plus:0.12, target:0.33,
    once:62301, twice:14036, threePlus:10463, total:86800,
    pctDaily:0.7178, pctDailyPrior:0.68
  },
  funnel: {
    dailyVisits:83800, target:120000, avg7d:79033,
    started:98, completed:23, trialExpiring:84
  },
  engagement: {
    pct5Min:0.102, target:0.33, count5Min:8061,
    articles:42000, video:9042, both:2001, avgVisits:79033
  }
};
/* Level 2 targets — add from the spreadsheet as they're agreed. */
const L2_TARGETS = {
  conversion: 0.90
};
/* Thresholds as a share of target */
const THRESHOLDS = { green:0.80, amber:0.60 };
/* For lagging metrics (no target): change since first month */
const TREND_THRESHOLDS = { green:0, amber:-0.03 };
/* =============================================================== */

const fmt = n => n.toLocaleString("en-GB");
const pct = (n,d=1) => (n*100).toFixed(d).replace(/\.0$/,"")+"%";
const gbp = n => "£"+(n>=1e6?(n/1e6).toFixed(2)+"m":n>=1000?Math.round(n/1000)+"k":fmt(n));
const short = n => n>=1e6?(n/1e6).toFixed(2)+"M":fmt(n);

function rag(ratio){
  if(ratio>=THRESHOLDS.green) return "green";
  if(ratio>=THRESHOLDS.amber) return "amber";
  return "red";
}
function ragTrend(change){
  if(change>=TREND_THRESHOLDS.green) return "green";
  if(change>=TREND_THRESHOLDS.amber) return "amber";
  return "red";
}
const RAG_TEXT = {green:"On track", amber:"At risk", red:"Off track"};
const ragVars = r => `--rag:var(--${r});--rag-bg:var(--${r}-bg);--rag-ink:var(--${r}-ink, var(--${r}))`;
const pill = r => `<span class="pill">${RAG_TEXT[r]}</span>`;
const OWNERS = {product:"Product", marketing:"Marketing", adops:"Ad Ops"};
const owner = o => `<span class="owner o-${o}">${OWNERS[o]}</span>`;

function bar(value,target,fmtFn,hidePct){
  const w = Math.min(100, value/target*100);
  return `<div class="bar" role="img" aria-label="${fmtFn(value)} of ${fmtFn(target)} target"><i style="width:${w}%"></i><b></b></div>
          <div class="barlbl"><span>${hidePct?"":Math.round(value/target*100)+"% of target"}</span><span>Target ${fmtFn(target)}</span></div>`;
}
function delta(now,prev,label,isPct){
  const diff = now-prev;
  const cls = diff>=0?"up":"down";
  const sign = diff>=0?"▲ +":"▼ ";
  const txt = isPct ? (diff*100).toFixed(1)+" pts" : (diff/prev*100).toFixed(1)+"%";
  return `<div class="delta"><strong class="${cls}">${sign}${txt.replace("-","")}</strong> ${label}</div>`;
}
function spark(values,color){
  const w=260,h=50,p=4,min=Math.min(...values),max=Math.max(...values);
  const pts=values.map((v,i)=>[p+i*(w-2*p)/(values.length-1), h-p-(v-min)/(max-min||1)*(h-2*p)]);
  const d=pts.map((pt,i)=>(i?"L":"M")+pt[0].toFixed(1)+" "+pt[1].toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${color}"/></svg>`;
}

/* ---------- Quadrants ---------- */
const L = DATA.lagging, last = a => a[a.length-1];
const subChange = (last(L.subscribers)-L.subscribers[0])/L.subscribers[0];
const lagRag = ragTrend(subChange);

const T = DATA.timeSpent, F = DATA.frequency, S = DATA.funnel, E = DATA.engagement;
const tRag = rag(T.value/T.target), fRag = rag(F.pct3Plus/F.target), sRag = rag(S.dailyVisits/S.target), eRag = rag(E.pct5Min/E.target);

const quads = [
  { pos:"tl", key:"lagging", title:"Lagging Metrics", rag:lagRag, body:`
      <div class="label">Total subscribers (Oct)</div>
      <div class="big">${fmt(last(L.subscribers))}</div>
      ${delta(last(L.subscribers),L.subscribers[0],"since Jan")}
      ${spark(L.subscribers,`var(--${lagRag})`)}
      <div class="minis">
        <div class="mini"><div class="v">${gbp(last(L.subRevenue))}</div><div class="l">Sub. revenue</div>${owner("marketing")}</div>
        <div class="mini"><div class="v">${gbp(last(L.adRevenue))}</div><div class="l">Ad revenue</div>${owner("adops")}</div>
        <div class="mini"><div class="v">${fmt(last(L.downloads))}</div><div class="l">Downloads</div>${owner("marketing")}</div>
      </div>
      <div class="note">Status reflects trend since January.</div>`, cta:"View whole year →"},
  { pos:"tr", key:"funnel", title:"Subscription Funnel", rag:sRag, owner:"product", body:`
      <div class="label">Daily subscription unique visits (last 24h)</div>
      <div class="big">${fmt(S.dailyVisits)}</div>
      ${bar(S.dailyVisits,S.target,fmt)}
      ${delta(S.dailyVisits,S.avg7d,"vs 7-day average")}`},
  { pos:"bl", key:"frequency", title:"Frequency", rag:fRag, owner:"product", body:`
      <div class="label">Subscribers visiting 3+ times per day (last 7 days)</div>
      <div class="big">${pct(F.pct3Plus)}<small>${fmt(F.threePlus)} subs</small></div>
      ${bar(F.pct3Plus,F.target,v=>pct(v),true)}`},
  { pos:"br", key:"engagement", title:"Engagement", rag:eRag, owner:"product", body:`
      <div class="label">Subscribers spending 5+ min in a session (last 7 days)</div>
      <div class="big">${pct(E.pct5Min)}<small>${fmt(E.count5Min)} subs</small></div>
      ${bar(E.pct5Min,E.target,v=>pct(v),true)}`}
];

/* ---------- Level 2 alerts ---------- */
const alertVars = r => `--a:var(--${r});--a-bg:var(--${r}-bg);--a-ink:var(--${r}-ink, var(--${r}))`;
function l2Flags(key){
  const f=[];
  if(key==="funnel" && L2_TARGETS.conversion!=null) f.push(rag(S.completed/S.started/L2_TARGETS.conversion));
  return f.filter(r=>r!=="green");
}
function ctaHtml(q){
  const label = q.cta || "View Level 2 metrics →";
  const flags = l2Flags(q.key);
  if(!flags.length) return `<button class="cta" data-key="${q.key}">${label}</button>`;
  const worst = flags.includes("red") ? "red" : "amber";
  const n = flags.length;
  return `<div class="cta-wrap" style="${alertVars(worst)}">
    <button class="cta" data-key="${q.key}">${label}</button>
    <span class="alert-note">⚠ ${n} metric${n>1?"s":""} need${n>1?"":"s"} action</span>
  </div>`;
}

const board = document.getElementById("board");
board.innerHTML = quads.map(q=>`
  <section class="quad ${q.pos}" style="${ragVars(q.rag)}" aria-labelledby="h-${q.key}">
    <div class="qhead"><h2 id="h-${q.key}">${q.title}</h2>${pill(q.rag)}</div>
    ${q.owner ? `<div class="eyebrow">${owner(q.owner)}</div>` : ""}
    ${q.body}
    ${ctaHtml(q)}
  </section>`).join("") + centre();

function centre(){
  const r=118, c=2*Math.PI*r, frac=Math.min(1,T.value/T.target);
  return `<section class="centre" style="${ragVars(tRag)}" aria-labelledby="h-time">
    <svg class="ring" viewBox="0 0 250 250" aria-hidden="true">
      <circle cx="125" cy="125" r="${r}" fill="none" stroke="#eceef2" stroke-width="8"/>
      <circle cx="125" cy="125" r="${r}" fill="none" stroke="var(--rag)" stroke-width="8" stroke-linecap="round"
        stroke-dasharray="${c*frac} ${c}" transform="rotate(-90 125 125)"/>
    </svg>
    <div class="inner">
      <h2 id="h-time">Time Spent</h2>
      <div style="display:flex;gap:6px;align-items:center">${pill(tRag)}${owner("product")}</div>
      <div class="big">${short(T.value)}</div>
      <div class="label">minutes, last 7 days<br>Target ${short(T.target)} · ${Math.round(T.value/T.target*100)}%</div>
      ${delta(T.value,T.prior,"vs prior week")}
    </div>
  </section>`;
}

/* ---------- Level 2 drill-downs ---------- */
const row = (name,sub,val,r) => {
  const flag = r && r!=="green";
  return `<div class="row${flag?" flag":""}" ${flag?`style="${alertVars(r)}"`:""}><div><div class="n">${name}</div>${sub?`<div class="s">${sub}</div>`:""}</div><div class="v">${val}${r?` <span style="${ragVars(r)};margin-left:6px">${pill(r)}</span>`:""}</div></div>`;
};
const LEVEL2 = {
  lagging: { title:"Lagging Metrics: monthly detail", html:()=>`
    <table><thead><tr><th>Month</th><th>Downloads<br>${owner("marketing")}</th><th>Subscribers<br>${owner("marketing")}</th><th>Sub. revenue<br>${owner("marketing")}</th><th>Ad revenue<br>${owner("adops")}</th></tr></thead><tbody>
    ${L.months.map((m,i)=>`<tr><td>${m} 26</td><td>${fmt(L.downloads[i])}</td><td>${fmt(L.subscribers[i])}</td><td>£${fmt(L.subRevenue[i])}</td><td>£${fmt(L.adRevenue[i])}</td></tr>`).join("")}
    </tbody></table>
    <div class="note">Subscription price: £5 per month.</div>`},
  funnel: { title:"Subscription Funnel: Level 2", html:()=>`
    ${row("Sign-up journey started","Last 24 hours",fmt(S.started))}
    ${row("Sign-up journey completed","Last 24 hours",fmt(S.completed))}
    ${row("Conversion rate",`Completed ÷ started · <strong>Target ${pct(L2_TARGETS.conversion)}</strong>`,pct(S.completed/S.started,2),rag(S.completed/S.started/L2_TARGETS.conversion))}
    ${row("Free-trial visits with &lt;3 days remaining","Last 24 hours",fmt(S.trialExpiring))}`},
  frequency: { title:"Frequency: Level 2", html:()=>`
    ${row("% subscribers visiting daily",`Week prior ${pct(F.pctDailyPrior)} · ${(F.pctDaily-F.pctDailyPrior>=0?"▲ +":"▼ ")+((F.pctDaily-F.pctDailyPrior)*100).toFixed(1)} pts`,pct(F.pctDaily,2))}`},
  engagement: { title:"Engagement: Level 2", html:()=>`
    ${row("3+ articles in a session",`${fmt(E.articles)} of ${fmt(E.avgVisits)} avg visits`,pct(E.articles/E.avgVisits,0))}
    ${row("3+ minutes of video in a session",`${fmt(E.video)} of ${fmt(E.avgVisits)} avg visits`,pct(E.video/E.avgVisits,0))}
    ${row("Article and video in a session",`${fmt(E.both)} of ${fmt(E.avgVisits)} avg visits`,pct(E.both/E.avgVisits,0))}`}
};

const drill = document.getElementById("drill");
board.addEventListener("click", e=>{
  const btn = e.target.closest(".cta"); if(!btn) return;
  const l2 = LEVEL2[btn.dataset.key];
  document.getElementById("dTitle").textContent = l2.title;
  document.getElementById("dBody").innerHTML = l2.html();
  drill.showModal();
});
drill.addEventListener("click", e=>{ if(e.target===drill) drill.close(); });
document.getElementById("asOf").textContent = DATA.asOf;
</script>
</body>
</html>
